<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- Google Site Verification -->
  <meta name="google-site-verification" content="7kfckABSquTNISxd-uCE4q3AggSMDxyCPodZhcgLX6I" />

  <!-- Inline critical CSS for content that must be available in static HTML
       but must not flash before React takes over the page. -->
  <style>
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }

    /* The build-time SEO shell gives non-JavaScript crawlers meaningful HTML.
       JavaScript visitors receive the actual React route, so hide the shell
       before first paint to prevent its fallback copy from flashing briefly. */
    html.js [data-seo-shell] {
      display: none;
    }
  </style>

  <!-- Performance Optimizations -->
  <!-- DNS Prefetch for external domains -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

  <!-- Preconnect to critical origins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- LCP: preload hero image (desktop default; picture sources handle mobile) -->
  <link rel="preload" as="image" href="/hero-bg-new-desktop.webp" type="image/webp" fetchpriority="high" />
  <link rel="preload" as="image" href="/hero-bg-new-mobile.webp" type="image/webp" media="(max-width: 640px)" />

  <!-- Storefront typography: editorial headings, highly legible technical body copy, and tabular prices. -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

  <!-- Primary Meta Tags -->

  <meta property="og:description"
    content="Buy drip irrigation systems, sprinklers, irrigation kits, pumps and filters in Kenya. DripTech Eco Flow supplies and installs irrigation equipment for farms nationwide." />

  <!-- Security Headers (Note: X-Frame-Options must be set via HTTP headers, not meta tags) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

  <!-- Favicon - SVG Only -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="theme-color" content="#2d6a4f" />

  <!-- Structured data is injected per route by SEOHead. -->

  <!-- Theme initialization script - prevents FOUC (Flash of Unstyled Content) -->
  <script>
    (function () {
      const root = document.documentElement;
      root.classList.add('js');

      try {
        const theme = localStorage.getItem('vite-ui-theme') || 'system';

        if (theme === 'system') {
          const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          root.classList.add(systemTheme);
        } else {
          root.classList.add(theme);
        }
      } catch (e) {
        root.classList.add('light');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
